  <text x="192" y="146" fill="#A9B9DA" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="650">小算盘 · COST BASIS CALCULATOR</text>

  <!-- Main copy -->
  <text x="72" y="251" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">做 T 前先测算</text>
  <text x="72" y="307" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">交易前先预估</text>
  <text x="74" y="355" fill="#9FB1D5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">港股 / 美股 · 做 T · 加仓 · 减仓 · 摊薄成本</text>


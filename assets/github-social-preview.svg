      <text x="15" y="21" fill="#4F65E8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10" font-weight="720">买入后 · 新成本</text>
      <text x="15" y="41" fill="#304ACB" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="840">92.23</text>
    </g>

    <text x="48" y="322" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="780">回本成本演变</text>
    <text x="546" y="322" text-anchor="end" fill="#475467" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.6">COST BASIS FLOW</text>

    <path d="M60 445C129 422 178 457 236 416C293 376 349 405 401 366C441 336 492 351 540 333" fill="none" stroke="#D8E0EF" stroke-width="10" stroke-linecap="round" opacity="0.32"/>
    <path d="M60 445C129 422 178 457 236 416C293 376 349 405 401 366C441 336 492 351 540 333" fill="none" stroke="url(#curve)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="60" cy="445" r="7" fill="#7894FF" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="236" cy="416" r="7" fill="#699EFD" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="401" cy="366" r="7" fill="#59C3FF" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="540" cy="333" r="8" fill="#65D89A" stroke="#FFFFFF" stroke-width="4"/>

    <g transform="translate(57 350)">
      <rect width="114" height="47" rx="12" fill="#F4F6FB" stroke="#E4E9F2"/>
      <text x="14" y="19" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10">交易前</text>
      <text x="14" y="37" fill="#101828" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800">94.00</text>
    </g>
    <g transform="translate(250 330)">
      <rect width="114" height="47" rx="12" fill="#F4F6FB" stroke="#E4E9F2"/>
      <text x="14" y="19" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10">卖出后</text>
      <text x="14" y="37" fill="#101828" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800">100.84</text>
    </g>
    <g transform="translate(414 404)">

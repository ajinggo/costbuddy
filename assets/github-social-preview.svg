    <text x="410" y="228" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">资金净变化</text>
    <text x="548" y="229" text-anchor="end" fill="#087B49" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="780">+1,063</text>


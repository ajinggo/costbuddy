    <rect x="22" y="14" width="52" height="64" rx="17" fill="#FFFFFF"/>
    <rect x="31" y="23" width="34" height="15" rx="5" fill="#DFE5FF"/>
    <circle cx="34" cy="51" r="4" fill="#7188F5"/>
    <circle cx="48" cy="51" r="4" fill="#7188F5"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CostBuddy 你的做T搭子</title>
  <desc id="desc">支持港股、A股与美股的交易计划测算工具，展示持仓、计划和成本变化流程示意</desc>
  <defs>
    <linearGradient id="bg" x1="36" y1="24" x2="1232" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080E1A"/>
      <stop offset="0.48" stop-color="#111D38"/>
      <stop offset="1" stop-color="#193564"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#829AFF"/>
      <stop offset="1" stop-color="#4F65E8"/>
    </linearGradient>
    <linearGradient id="glass" x1="650" y1="80" x2="1208" y2="572" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/>
    </linearGradient>
    <radialGradient id="haloBlue" cx="0" cy="0" r="1" gradientTransform="translate(1133 76) rotate(131) scale(330)">
      <stop stop-color="#4774FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4774FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloCyan" cx="0" cy="0" r="1" gradientTransform="translate(525 638) rotate(-70) scale(300 470)">
      <stop stop-color="#1D9BF0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1D9BF0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#02050B" flood-opacity="0.46"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02050B" flood-opacity="0.25"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#A9BBE8" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="32" fill="url(#grid)"/>
  <rect width="1280" height="640" rx="32" fill="url(#haloBlue)"/>
  <rect width="1280" height="640" rx="32" fill="url(#haloCyan)"/>
  <path d="M0 540C235 468 411 590 651 510C878 435 1043 488 1280 402V640H0Z" fill="#FFFFFF" opacity="0.025"/>

  <!-- Header brand -->
  <g transform="translate(72 64)" filter="url(#softShadow)">
    <rect width="92" height="92" rx="28" fill="url(#brand)"/>
    <rect x="22" y="14" width="52" height="64" rx="17" fill="#FFFFFF"/>
    <rect x="31" y="23" width="34" height="15" rx="5" fill="#DFE5FF"/>
    <circle cx="34" cy="51" r="4" fill="#7188F5"/>
    <circle cx="48" cy="51" r="4" fill="#7188F5"/>
    <circle cx="62" cy="51" r="4" fill="#7188F5"/>
    <path d="M35 64c4 4 8 5.5 13 5.5S57 68 61 64" fill="none" stroke="#4F65E8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="76" cy="16" r="6" fill="#FFBD70"/>
  </g>

  <text x="190" y="112" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="47" font-weight="830" letter-spacing="-1.6">CostBuddy</text>
  <text x="192" y="146" fill="#A9B9DA" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="650">你的做T搭子 · 交易计划测算工具</text>

  <!-- Main copy -->
  <text x="72" y="251" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">交易计划先算清</text>
  <text x="72" y="307" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">持仓成本再决定</text>
  <text x="74" y="355" fill="#9FB1D5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">港股 · A 股 · 美股　/　做 T · 加仓 · 减仓</text>

  <g transform="translate(72 400)">
    <rect width="132" height="43" rx="21.5" fill="#FFFFFF" fill-opacity="0.085" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="23" cy="21.5" r="5" fill="#7894FF"/>
    <text x="39" y="28" fill="#ECF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="680">测算成本</text>
    <rect x="146" width="132" height="43" rx="21.5" fill="#FFFFFF" fill-opacity="0.085" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="169" cy="21.5" r="5" fill="#59C3FF"/>
    <text x="185" y="28" fill="#ECF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="680">比较方案</text>
    <rect x="292" width="148" height="43" rx="21.5" fill="#FFFFFF" fill-opacity="0.085" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="315" cy="21.5" r="5" fill="#65D89A"/>
    <text x="331" y="28" fill="#ECF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="680">费用估算</text>
  </g>

  <g transform="translate(72 513)">
    <circle cx="9" cy="9" r="9" fill="#4F65E8"/>
    <path d="m5 9 2.7 2.7L13.3 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="16" fill="#D4DDF0" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700">本地计算 · 数据保存在你的浏览器</text>
  </g>

  <!-- Workflow illustration: illustrative labels only, no fabricated result values -->
  <g transform="translate(618 58)" filter="url(#shadow)">
    <rect width="594" height="524" rx="30" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="36" y="57" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="23" font-weight="780">一笔计划，三步看清</text>
    <text x="36" y="85" fill="#B8C7E2" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">流程示意 · 结果根据你填写的数据实时计算</text>

    <path d="M73 163V386" stroke="#A9BBE8" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="5 9"/>

    <rect x="32" y="112" width="530" height="112" rx="22" fill="#FFFFFF" fill-opacity="0.97"/>
    <circle cx="73" cy="168" r="23" fill="#EDF1FF"/>
    <text x="73" y="175" text-anchor="middle" fill="#4F65E8" font-family="Inter, sans-serif" font-size="19" font-weight="800">01</text>
    <text x="114" y="158" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="780">输入持仓基准</text>
    <text x="114" y="188" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">市场 · 股数 · 当前成本 · 股价</text>
    <rect x="421" y="145" width="112" height="38" rx="19" fill="#F2F5FB"/>
    <text x="477" y="169" text-anchor="middle" fill="#475467" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">港股 / A股 / 美股</text>

    <rect x="32" y="251" width="530" height="112" rx="22" fill="#FFFFFF" fill-opacity="0.97"/>
    <circle cx="73" cy="307" r="23" fill="#E9F7FF"/>
    <text x="73" y="314" text-anchor="middle" fill="#1689C7" font-family="Inter, sans-serif" font-size="19" font-weight="800">02</text>
    <text x="114" y="297" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="780">填写交易计划</text>
    <text x="114" y="327" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">买入 / 卖出 · 数量 · 预计费用</text>
    <g transform="translate(414 282)">
      <rect width="57" height="34" rx="17" fill="#EEF4FF"/>
      <text x="28.5" y="22" text-anchor="middle" fill="#4F65E8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="750">买入</text>
      <rect x="67" width="57" height="34" rx="17" fill="#FFF3E9"/>
      <text x="95.5" y="22" text-anchor="middle" fill="#C46A27" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="750">卖出</text>
    </g>

    <rect x="32" y="390" width="530" height="104" rx="22" fill="#EAF0FF" stroke="#AFC0FF" stroke-width="1.5"/>
    <circle cx="73" cy="442" r="23" fill="#D8E2FF"/>
    <text x="73" y="449" text-anchor="middle" fill="#4F65E8" font-family="Inter, sans-serif" font-size="19" font-weight="800">03</text>
    <text x="114" y="432" fill="#182B76" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="780">查看测算结果</text>
    <text x="114" y="462" fill="#4F5E8B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">回本成本 · 持仓变化 · 资金明细</text>
    <path d="M494 431h30m-9-9 9 9-9 9" fill="none" stroke="#4F65E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="1" y="1" width="1278" height="638" rx="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>

    <text x="39" y="28" fill="#ECF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="680">测算成本</text>
    <rect x="146" width="132" height="43" rx="21.5" fill="#FFFFFF" fill-opacity="0.085" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="169" cy="21.5" r="5" fill="#59C3FF"/>
    <text x="185" y="28" fill="#ECF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="680">比较方案</text>
    <rect x="292" width="148" height="43" rx="21.5" fill="#FFFFFF" fill-opacity="0.085" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="315" cy="21.5" r="5" fill="#65D89A"/>
    <text x="331" y="28" fill="#ECF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="680">控制成本</text>

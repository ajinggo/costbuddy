    <path d="m5 9 2.7 2.7L13.3 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="16" fill="#D4DDF0" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700">costbuddy.space</text>
